spring:
  application:
    name: velora-api

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=velora;encrypt=true;trustServerCertificate=true
    username: sa
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 32
        format_sql: true
    show-sql: false

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs

velora:
  storage:
    local-path: D:/ibrahim_watches/velora-uploads
    public-url-prefix: http://localhost:8080/uploads
    max-file-size-bytes: 5242880
  jwt:
    secret: ${JWT_SECRET}
    access-token-minutes: 30
    refresh-token-days: 30
  guest-token:
    # Falls back to JWT_SECRET so this does not become a second mandatory env var —
    # set GUEST_TOKEN_SECRET explicitly to use a separate key.
    secret: ${GUEST_TOKEN_SECRET:${JWT_SECRET}}
    # Transition switch: accept old, unsigned X-Guest-Token values (logged at WARN)
    # instead of rejecting every cart created before signing existed. Flip to false
    # once enough time has passed that no legitimate legacy cart is still in use.
    accept-legacy-unsigned: true
  cors:
    allowed-origins: http://localhost:4200
  business:
    reservation-ttl-minutes: 20
    default-tax-rate: 0.14
    prices-include-tax: true