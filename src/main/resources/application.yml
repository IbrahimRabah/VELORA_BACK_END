spring:
  application:
    name: velora-api

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=velora;encrypt=true;trustServerCertificate=true
    username: sa
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 32
        format_sql: true
    show-sql: false

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs

velora:
  jwt:
    secret: ${JWT_SECRET}
    access-token-minutes: 30
    refresh-token-days: 30
  cors:
    allowed-origins: http://localhost:4200
  business:
    reservation-ttl-minutes: 20
    default-tax-rate: 0.14
    prices-include-tax: true